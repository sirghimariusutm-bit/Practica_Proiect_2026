<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laborator de Validare - Ziua 5</title>
    <style>
        /* Definirea variabilei CSS pentru fundal */
        :root {
            --bg-formular: #f4f4f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
        }

        #registrationForm {
            background-color: var(--bg-formular);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 350px;
            transition: background 0.3s ease;
        }

        h2 { text-align: center; color: #333; margin-top: 0; }

        .field-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus { border-color: #3498db; outline: none; }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover { background-color: #2980b9; }

        .hint { font-size: 0.8rem; color: #777; margin-top: 3px; }
    </style>
</head>
<body>

<form id="registrationForm">
    <h2>Înregistrare</h2>

    <!-- Username: Minim 5 caractere, doar litere mici și cifre -->
    <div class="field-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               pattern="[a-z0-9]{5,}" 
               title="Minim 5 caractere, doar litere mici și cifre.">
        <div class="hint">Litere mici și cifre (min. 5)</div>
    </div>

    <!-- Parolă: Regex complex (1 mare, 1 număr, 1 simbol, min 8) -->
    <div class="field-group">
        <label for="password">Parolă</label>
        <input type="password" id="password" name="password" required
               pattern="(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}"
               title="Minim 8 caractere, o literă mare, un număr și un simbol.">
        <div class="hint">Min. 8 caractere (A, 1, #)</div>
    </div>

    <!-- Data Rezervării: Doar Luna Mai 2026 -->
    <div class="field-group">
        <label for="data">Data Rezervării</label>
        <input type="date" id="data" name="data" required
               min="2026-05-01" max="2026-05-31">
        <div class="hint">Doar în luna Mai 2026</div>
    </div>

    <!-- Culoare Temă: Modifică variabila CSS -->
    <div class="field-group">
        <label for="colorPicker">Culoare Temă Formular</label>
        <input type="color" id="colorPicker" value="#f4f4f9">
    </div>

    <button type="submit">Finalizează Testul</button>
</form>

<script>
    const colorPicker = document.getElementById('colorPicker');
    const root = document.querySelector(':root');

    // Ascultăm schimbarea culorii și actualizăm variabila CSS
    colorPicker.addEventListener('input', (e) => {
        root.style.setProperty('--bg-formular', e.target.value);
    });

    // Mesaj de succes la trimitere (pentru testare)
    document.getElementById('registrationForm').onsubmit = function(e) {
        e.preventDefault();
        alert('Formular validat cu succes! Felicitări pentru task-ul de Ziua 5.');
    };
</script>

</body>
</html>
