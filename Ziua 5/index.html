<section id="contact" style="padding: 50px 0;">
    <div class="contact-container">
        
        <!-- Formularul (2/3 din lățime) -->
        <form action="#" class="contact-form">
            <h2>Contact Vanguard Security</h2>

            <!-- Grupare Logică cu fieldset și legend -->
            <fieldset>
                <legend>Date Personale</legend>
                <div class="input-box">
                    <label>Nume Complet</label>
                    <input type="text" name="nume" placeholder="Ex: Ion Popescu" autocomplete="name" required>
                </div>
                <div class="input-box">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="nume@exemplu.com" autocomplete="email" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Detalii Mesaj</legend>
                <div class="input-box">
                    <label>Subiectul solicitării</label>
                    <select name="subiect" class="select-stilizat">
                        <option value="" disabled selected>Alege o opțiune...</option>
                        <option value="paza">Pază și Protecție</option>
                        <option value="sisteme">Sisteme Alarmă</option>
                        <option value="consultanta">Consultanță</option>
                    </select>
                </div>
                <div class="input-box">
                    <label>Mesajul tău (Maxim 500 caractere)</label>
                    <!-- maxlength asigură limita de caractere fără JS -->
                    <textarea name="mesaj" maxlength="500" placeholder="Scrie aici..."></textarea>
                    <small>Limita: 500 caractere</small>
                </div>
            </fieldset>

            <button type="submit" class="btn-trimite">Trimite Mesaj</button>
        </form>

        <!-- Harta/Detalii (1/3 din lățime) -->
        <div class="contact-info">
            <h3>Unde ne găsiți</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2717.382173167104!2d28.85871217684841!3d47.05228512543037!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40c97d3916295555%3A0xc345706598c47432!2sColegiul%20Universit%C4%83%C5%A3ii%20Tehnice%20a%20Moldovei!5e0!3m2!1sro!2smd!4v1714980000000!5m2!1sro!2smd" width="100%" height="300" style="border:0; border-radius: 10px;" allowfullscreen="" loading="lazy"></iframe>
            <div class="contact-text">
                <p><strong>📍 Adresă:</strong> Str. Voluntarilor 1, Chișinău</p>
                <p><strong>📞 Telefon:</strong> 022 123 456</p>
            </div>
        </div>

    </div>
</section>
