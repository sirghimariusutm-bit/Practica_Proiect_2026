<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Control | Vanguard</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 50px 20px; background: #050505; color: white; }
        .audit-nav { position: fixed; top: 20px; left: 20px; }
        .audit-nav a { color: #00f2ff; text-decoration: none; font-weight: bold; border: 1px solid #00f2ff; padding: 5px 10px; border-radius: 5px; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 800px; margin: 40px 0; }
        .system-card { background: #111; padding: 25px; border-radius: 12px; border: 1px solid #222; text-align: center; transition: 0.3s; will-change: transform; }
        .system-card:hover { border-color: #00f2ff; transform: translateY(-5px); box-shadow: 0 0 15px rgba(0,242,255,0.3); }

        .auth-form { background: #111; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 30px; border: 1px solid #222; }
        .auth-form__group { position: relative; }
        .auth-form__input { width: 100%; padding: 10px 0; background: transparent; border: none; border-bottom: 2px solid #333; color: white; outline: none; font-size: 16px; }
        .auth-form__label { position: absolute; left: 0; top: 10px; color: #666; transition: 0.3s; pointer-events: none; }
        .auth-form__input:focus + .auth-form__label, .auth-form__input:not(:placeholder-shown) + .auth-form__label { transform: translateY(-25px); font-size: 12px; color: #00f2ff; }
    </style>
</head>
<body>

    <div class="audit-nav"><a href="../ziua7.html">⬅ Înapoi la Site</a></div>

    <h1 style="color:#00f2ff;">System Control Audit</h1>
    <p style="opacity:0.6;">Validare Arhitectură BEM & Securitate GPU</p>

    <div class="dashboard">
        <div class="system-card"><h3>60 FPS</h3><p>Render Stability</p></div>
        <div class="system-card"><h3>BEM Layers</h3><p>Clean Code</p></div>
        <div class="system-card"><h3>ENCRYPTED</h3><p>Security Status</p></div>
    </div>

    <form class="auth-form">
        <div class="auth-form__group">
            <input type="email" class="auth-form__input" placeholder=" " required>
            <label class="auth-form__label">Introduceți Email-ul Administrator</label>
        </div>
        <button type="submit" class="auth-form__button">AUTORIZEAZĂ ACCESUL</button>
    </form>

</body>
</html>
